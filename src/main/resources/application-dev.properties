# ===============================
# DataSource (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/event_db?createDatabaseIfNotExist=true\
# more sql queries not needed for now
# &useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Stockholm
spring.datasource.username=root
spring.datasource.password=root



# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dev-only suggestion:
# - create / create-drop wipes your tables each restart
# - update keeps data but evolves schema
# - validate checks schema without changing it (good for production)
spring.jpa.hibernate.ddl-auto=create

# ===============================
# Connection Pool (HikariCP) - Default in Spring Boot
# ===============================
spring.datasource.hikari.pool-name=HikariJpaPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Connection pools manage a set of database connections that can be reused,
# avoiding the overhead of creating a new connection for each database request.
# HikariCP is a high-performance JDBC connection pool and is the default in Spring Boot.
#
# Key Configuration Properties:
# - pool-name: Name for the connection pool (useful for monitoring/logging)
# - maximum-pool-size: Maximum number of connections in the pool (default: 10)
# - minimum-idle: Minimum number of idle connections HikariCP maintains (default: same as maximum-pool-size)
# - connection-timeout: Maximum time (ms) a client will wait for a connection from the pool (default: 30000ms)
# - idle-timeout: Maximum time (ms) a connection can sit idle in the pool before being removed (default: 600000ms = 10 min)
# - max-lifetime: Maximum lifetime (ms) of a connection in the pool (default: 1800000ms = 30 min)
# - connection-test-query: Query executed to test connection validity (optional, HikariCP has better alternatives)
#
# Benefits of Connection Pooling:
# - Improved performance by reusing existing connections
# - Reduced latency (no connection establishment overhead per request)
# - Better resource management and control over database connections
# - Protection against connection leaks and resource exhaustion
